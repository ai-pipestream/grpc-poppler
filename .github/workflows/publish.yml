name: Publish Images

# Builds the service image and pushes it to docker.io/pipestreamai. Every
# push to main republishes :latest; a manual dispatch with a version input
# also tags that version. Docker Hub credentials come from the DOCKER_USER /
# DOCKER_TOKEN org secrets.
#
# amd64-only: the C++ services publish amd64 only (emulated arm64 C++ builds
# are too slow), so no QEMU setup and a single linux/amd64 platform.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Extra version tag (for example 0.1.0); optional'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub (docker.io)
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Compute tags and build version
        id: tags
        run: |
          svc="docker.io/pipestreamai/grpc-poppler:latest"
          version="dev"
          if [ -n "${{ inputs.version }}" ]; then
            svc="$svc,docker.io/pipestreamai/grpc-poppler:${{ inputs.version }}"
            version="${{ inputs.version }}"
          else
            version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          echo "svc=$svc" >> "$GITHUB_OUTPUT"
          echo "build_version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and push the service image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.svc }}
          build-args: |
            GRPC_POPPLER_BUILD_VERSION=${{ steps.tags.outputs.build_version }}
